<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Halloween I — As Casas dos Perdidos</title>
  <desc id="desc">Memória-troféu da primeira fase, com a vila assombrada iluminada pela lua e pela lanterna.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07101f" stop-opacity=".02"/>
      <stop offset=".56" stop-color="#07101f" stop-opacity=".12"/>
      <stop offset="1" stop-color="#05070c" stop-opacity=".94"/>
    </linearGradient>
    <radialGradient id="glow" cx=".52" cy=".38" r=".64">
      <stop offset="0" stop-color="#ffcb67" stop-opacity=".15"/>
      <stop offset=".55" stop-color="#e67521" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000" stop-opacity=".48"/>
    </radialGradient>
    <filter id="warm">
      <feColorMatrix type="matrix" values="
        1.08 0 0 0 .02
        0 1.00 0 0 0
        0 0 .90 0 0
        0 0 0 1 0"/>
    </filter>
  </defs>

  <image href="../phase1/backgrounds/bg-village.png" x="0" y="0" width="1200" height="760"
         preserveAspectRatio="xMidYMid slice" filter="url(#warm)"/>
  <rect width="1200" height="760" fill="url(#glow)"/>
  <rect width="1200" height="760" fill="url(#shade)"/>

  <g fill="none">
    <rect x="16" y="16" width="1168" height="728" rx="32" stroke="#2b1508" stroke-width="18"/>
    <rect x="25" y="25" width="1150" height="710" rx="26" stroke="#b36d1b" stroke-width="5"/>
    <rect x="38" y="38" width="1124" height="684" rx="20" stroke="#efb649" stroke-opacity=".72" stroke-width="2"/>
  </g>

  <g transform="translate(600 622)">
    <path d="M-340 0 H340" stroke="#d7902e" stroke-opacity=".54" stroke-width="2"/>
    <path d="M-110 -50 C-78 -72 -38 -72 0 -52 C38 -72 78 -72 110 -50" fill="none" stroke="#e7aa3f" stroke-width="3"/>
    <circle cx="0" cy="-52" r="9" fill="#ffb53d"/>
    <text x="0" y="-86" text-anchor="middle" fill="#ffd883" font-family="Georgia,serif" font-size="28" letter-spacing="7">HALLOWEEN I</text>
    <text x="0" y="-28" text-anchor="middle" fill="#fff0bd" font-family="Georgia,serif" font-weight="700" font-size="48">AS CASAS DOS PERDIDOS</text>
    <text x="0" y="34" text-anchor="middle" fill="#e8c88b" font-family="Georgia,serif" font-style="italic" font-size="25">Na vila dos esquecidos, uma luz voltou a brilhar.</text>
  </g>

  <g transform="translate(92 84)">
    <path d="M0 50 C0 17 27 0 54 0 C81 0 108 17 108 50 C108 82 81 105 54 105 C27 105 0 82 0 50Z" fill="#bd5718" stroke="#f3a233" stroke-width="4"/>
    <path d="M53 -9 C54 -28 66 -35 82 -33 C72 -24 69 -15 70 -3" fill="#4b3b16"/>
    <path d="M24 43 L42 31 L42 51 Z M84 43 L66 31 L66 51 Z" fill="#ffe075"/>
    <path d="M29 68 Q54 88 79 68 Q54 98 29 68Z" fill="#ffe075"/>
  </g>
</svg>