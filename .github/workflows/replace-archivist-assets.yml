name: Replace Archivist artwork

on:
  push:
    paths:
      - ".github/workflows/replace-archivist-assets.yml"

permissions:
  contents: write

jobs:
  replace:
    if: github.event.head_commit.message == 'Install Archivist asset transfer workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download corrected Archivist assets
        env:
          RELEASE_01: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/c05598b7-4fc8-4123-9468-4f2b944bc1d5.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjcwMWRhMjYyMjBiNGZhNSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTAyNDgwNn0.eTcThIwLZsOor6_PlmiBQ2O16aMy0hN9TGOYPmE-bU4"
          RELEASE_02: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/3c9374af-20e2-4449-a606-9bdbfcade3ee.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmU5ZTI5NzQ3ZmIxNmM4OSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA2MTM2NH0.C2OZr6cfyAb1HMo3ce9PkvseZ73_nJOjr6DMlB1TsBo"
          RELEASE_03: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/1dce9a7a-41cb-46dc-8e8f-7a3271f84058.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmNmYzg4ZTZjMDRjYjIxNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA4MDU1MH0.RFPPyT3fVSjb6i1ibanC4b-qVCcIYcKxap-tX2AE0Xo"
          FACES_02: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/6e54742c-dc1d-4072-a87a-b83340804376.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjI2YzBlYzE2NjlhNWYxNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA0NDAzM30.onmGCD4GFMxx_Z5jrjYdQPPIk_NXAtoH-suQG49VB5Q"
        run: |
          set -euo pipefail
          mkdir -p assets/game/phase3/boss/archivist/release
          mkdir -p assets/game/phase3/boss/archivist/faces
          curl -L --fail --retry 3 "$RELEASE_01" -o assets/game/phase3/boss/archivist/release/archivist-release-01.png
          curl -L --fail --retry 3 "$RELEASE_02" -o assets/game/phase3/boss/archivist/release/archivist-release-02.png
          curl -L --fail --retry 3 "$RELEASE_03" -o assets/game/phase3/boss/archivist/release/archivist-release-03.png
          curl -L --fail --retry 3 "$FACES_02" -o assets/game/phase3/boss/archivist/faces/archivist-faces-02.png

      - name: Verify PNG files
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path("assets/game/phase3/boss/archivist/release/archivist-release-01.png"),
              Path("assets/game/phase3/boss/archivist/release/archivist-release-02.png"),
              Path("assets/game/phase3/boss/archivist/release/archivist-release-03.png"),
              Path("assets/game/phase3/boss/archivist/faces/archivist-faces-02.png"),
          ]
          for p in paths:
              data = p.read_bytes()
              assert data.startswith(b"\x89PNG\r\n\x1a\n"), f"{p} is not PNG"
              assert len(data) > 100_000, f"{p} looks too small"
              print(p, len(data))
          PY

      - name: Commit replacement artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game/phase3/boss/archivist/release/archivist-release-01.png
          git add assets/game/phase3/boss/archivist/release/archivist-release-02.png
          git add assets/game/phase3/boss/archivist/release/archivist-release-03.png
          git add assets/game/phase3/boss/archivist/faces/archivist-faces-02.png
          git diff --cached --quiet && exit 0
          git commit -m "Replace Archivist release and faces artwork"
          git push
